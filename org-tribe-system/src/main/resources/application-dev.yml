server:
  port: 9090
  bes:
    basedir: ../document/bes
  store-lic-interval: 0
  servlet:
    context-path:
    compression:
      enabled: true
      mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

spring:
  application:
    name: systemdj
  servlet:
     multipart: 
        max-file-size: 10MB
        max-request-size: 10MB
#  mail:
#    host: smtp.163.com
#    username: jeecgos@163.com
#    password: ??
