zuul:
  ignored-services:
    - vis
    - VIS
  host:
    socket-timeout-millis: 600000
    connect-timeout-millis: 600000
  proxy:
      addProxyHeaders: true
  routes:
    talentpool:
      path: /talentpool/**
      sensitiveHeaders:
      serviceId: talentpool
    infoActive:
      path: /infoActive/**
      sensitiveHeaders:
      serviceId: infoActive
    inspection:
      path: /inspection/**
      sensitiveHeaders:
      serviceId: inspection
    indicatorsLib:
      path: /indicatorsLib/**
      sensitiveHeaders:
      serviceId: indicatorsLibdj
    seo:
      path: /seo/**
      sensitiveHeaders:
      serviceId: seo
    smartLibrary:
      path: /smartLibrary/**
      sensitiveHeaders:
      serviceId: smartLibrary
    fixedReport:
      path: /fixedReport/**
      sensitiveHeaders:
      serviceId: fixedReportdj
    vis:
      path: /vis/api/**
      sensitiveHeaders:
      serviceId: vis
    visScreen:
      path: /visScreen/**
      sensitiveHeaders:
      serviceId: vis


##timeout config
hystrix:
  command:
    default:
      execution:
        timeout:
          enabled: true
        isolation:
          thread:
            timeoutInMilliseconds: 600000
ribbon:
  ReadTimeout: 60000
  ConnectTimeout: 60000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1