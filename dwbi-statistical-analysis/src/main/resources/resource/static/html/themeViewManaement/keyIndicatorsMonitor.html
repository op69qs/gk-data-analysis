<link rel="stylesheet" href="/statisticalAnalysis/static/css/systemManagement/systemManagement.css"/>
<link rel="stylesheet" type="text/css" href="/statisticalAnalysis/static/css/forecast_analysis.css"/>
<script type="text/javascript" src="/statisticalAnalysis/assets/echart/echarts.min.js"></script>
<script type="text/javascript" src="/statisticalAnalysis/static/js/echartsKeyIndicatorsMonitor.js"></script>
<div id="bread">运维专题视图 > <span style="color:#1f5ec4;font-weight: bold;">重点指标专题视图</span></div>
<div class="layui-container" style="width:100%; margin-top:15px;height:100%;">
    <div class="layui-row">
        <div class="layui-col-md2 layui-col-lg2">
            <span>周期：</span>
            <input id="period" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择周期',
                   valueField:'value',
                   textField:'label',
                   data:
                   [
                   {'value':'2','label':'一小时'},
                   {'value':'3','label':'日'},{'value':'4','label':'月'},{'value':'5','label':'年'}
                   ],onChange:function(current, old){if(current!=old){changeTimeElement(current);}}
            "/>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>时间：</span>
            <span><input id="startTime1" class="easyui-combobox" data-options="prompt:'请选择起始时间'"/></span>
            <span style="display: none">
                <input id="startTime2" class="Wdate" placeholder="请选择起始时间"
                       onfocus="WdatePicker({readOnly : false,dateFmt : 'yyyy-MM-dd',isShowWeek : true,isShowClear: false, maxDate : '%y-%M-%d'});"/>
            </span>
            <span>&nbsp;—</span>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span><input id="endTime1" class="easyui-combobox" data-options="prompt:'请选择结束时间'"/></span>
            <span style="display: none">
                <input id="endTime2" class="Wdate" placeholder="请选择结束时间"
                       onfocus="WdatePicker({readOnly : false,dateFmt : 'yyyy-MM-dd',isShowWeek : true,isShowClear: false, maxDate : '%y-%M-%d'});"/>
            </span>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>平台：</span>
            <input id="platform" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择平台',
                   valueField:'value',
                   textField:'label',
                   url:'./statisticalAnalysis/keyIndicatorsMonitor/getIndexPlatform?type=devOps',
                   onChange:function(current, old){if(current!=old){changePlatformElement(current);}}
                    "/>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>指标：</span>
            <input id="indicators" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择指标',
                   valueField:'value',
                   textField:'label',
                   data:[]"/>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <a class="easyui-linkbutton" onclick="queryData()" style="weight:50%;height: 100%;">查询</a>
        </div>
    </div>
    <div class="layui-row" style="margin-top: 25px;height:100%">
        <div class="layui-col-md6 layui-col-lg6" style="height:100%;">
            <div class="layui-row backcolor" style="width:98%;height:49%">
                <span style="font-size: 17px;color: #1E88C7">重点指标峰值资源序时分析</span>
                <div id="echarts1" style="width:100%;height:90%;"></div>
            </div>
            <div class="layui-row backcolor" style="margin-top: 10px;width:98%;height:48%">
                <span style="font-size: 17px;color: #1E88C7">重点状态指标分析</span>
                <span style="float: right;margin-right: 5px;">
                     <input id="keyStateIndicators" class="easyui-combobox" style="width:200px;"
                            data-options="
                            prompt:'请选择重点状态指标',
                            valueField:'value',
                            textField:'label',
                            url:'./statisticalAnalysis/keyIndicatorsMonitor/getKeyIndicators?type=devOps&indexType=2',
                            onChange:function(current, old){if(current!=old){resetKeyStateEcharts(current);}}"/>
                    </span>
                <div id="echarts2" style="width:98%;height:90%;margin-top: 10px;"></div>
            </div>
        </div>
        <div class="layui-col-md6 layui-col-lg6" style="height:99%">
            <div class="backcolor" style="width:98%;height:100%;">
                <span style="font-size: 17px;color: #1E88C7">重点指标资源排名TOP15分析</span>
                <div id="echarts3" style="width:100%;height:90%;"></div>
            </div>
        </div>
    </div>
</div>
<script>
    //查询图表数据
    function queryData() {
        var periodVal = $("#period").combobox("getValue"); //周期
        var params = {
            period: periodVal,
            platform: $("#platform").combobox("getValue"),
            indicatorsId: $("#indicators").combobox("getValue"),
            indicatorsName: $("#indicators").combobox("getText"),
            startTime: ("3,4,5".indexOf(periodVal) == -1) ? $("#startTime1").combobox("getValue") : $("#startTime2").val(),
            endTime: ("3,4,5".indexOf(periodVal) == -1) ? $("#endTime1").combobox("getValue") : $("#endTime2").val(),
            platform: $("#platform").combobox("getValue")
        };
        if (params.period.length == 0) {
            layer.msg("请选择周期!");
            return;
        }
        if (params.startTime.length == 0 || params.endTime.length == 0) {
            layer.msg("请选择时间!");
            return;
        }
        if (params.startTime.length > 0 && params.endTime.length > 0 && params.endTime < params.startTime) {
            layer.msg("结束时间不能小于起始时间,请重新选择!");
            return;
        }
        if (params.platform.length == 0) {
            layer.msg("请选择平台!");
            return;
        }
        if (params.indicatorsId.length == 0) {
            layer.msg("请选择指标!");
            return;
        }
        //选择周期、时间、平台、指标之后才能调用查询方法
        if (periodVal.length > 0 && params.platform.length > 0 && params.indicatorsId.length > 0 && (params.startTime.length > 0 || params.endTime.length > 0)) {
            getServiceData(params);
            //点击查询需要查询重点状态指标数据
            // resetKeyStateEcharts($("#keyStateIndicators").combobox("getValue"));
        }
    }

    var xhrOnProgress = function (fun) {
        xhrOnProgress.onprogress = fun; //绑定监听
        //使用闭包实现监听绑
        return function () {
            //通过$.ajaxSettings.xhr();获得XMLHttpRequest对象
            var xhr = $.ajaxSettings.xhr();
            //判断监听函数是否为函数
            if (typeof xhrOnProgress.onprogress !== 'function')
                return xhr;
            //如果有监听函数并且xhr对象支持绑定时就把监听函数绑定上去
            if (xhrOnProgress.onprogress && xhr.upload) {
                xhr.upload.onprogress = xhrOnProgress.onprogress;
            }
            return xhr;
        }
    }
</script>
