<link rel="stylesheet" href="/statisticalAnalysis/static/css/systemManagement/systemManagement.css"/>
<link rel="stylesheet" type="text/css" href="/statisticalAnalysis/static/css/forecast_analysis.css"/>
<script type="text/javascript" src="/statisticalAnalysis/assets/echart/echarts.min.js"></script>
<script type="text/javascript" src="/statisticalAnalysis/static/js/echartsAnalysis.js"></script>
<script type="text/javascript" src="/statisticalAnalysis/static/js/datagrid-export.js"></script>
<div id="bread">预测分析 > <span style="color:#1f5ec4;font-weight: bold;">运维预测分析</span></div>
<div class="layui-container" style="width:100%; margin-top:15px;height:90%;">
    <div class="layui-row">
        <div class="layui-col-md2 layui-col-lg2">
            <span>指标：</span>
            <input id="indicators" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择指标',
                   valueField:'value',
                   textField:'label',
                   url:'./statisticalAnalysis/forecastAnalysis/getIndicatorsData?type=devOps&isStatus=1',
                   onChange:function(current, old){if(current!=old){changeIndicatorsElement(current);}}"
            />
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>资源：</span>
            <input id="resources" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择资源'"
            />
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>周期：</span>
            <input id="period" class="easyui-combobox" style="width:200px;"
                   data-options="
                   prompt:'请选择周期',
                   valueField:'value',
                   textField:'label',
                   data:
                   [
                   {'value':'2','label':'一小时'},
                   {'value':'3','label':'日'},{'value':'4','label':'月'},{'value':'5','label':'年'}
                   ],onChange:function(current, old){if(current!=old){changeTimeElement(current);}}
            "/>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span>时间：</span>
            <span><input id="startTime1" class="easyui-combobox" data-options="prompt:'请选择起始时间'"/></span>
            <span style="display: none">
                <input id="startTime2" class="Wdate" placeholder="请选择起始时间"
                       onfocus="WdatePicker({readOnly : false,dateFmt : 'yyyy-MM-dd',isShowWeek : true,isShowClear: false, maxDate : '%y-%M-%d'});"/>
            </span>
            <span>&nbsp;&nbsp;—</span>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <span><input id="endTime1" class="easyui-combobox" data-options="prompt:'请选择结束时间'"/></span>
            <span style="display: none">
                <input id="endTime2" class="Wdate" placeholder="请选择结束时间"
                       onfocus="WdatePicker({readOnly : false,dateFmt : 'yyyy-MM-dd',isShowWeek : true,isShowClear: false, maxDate : '%y-%M-%d'});"/>
            </span>
        </div>
        <div class="layui-col-md2 layui-col-lg2">
            <a class="easyui-linkbutton" onclick="queryData()" style="weight:50%;height: 100%">查询</a>
            <a class="easyui-linkbutton" onclick="showTable()" style="weight:50%;height: 100%">表格</a>
        </div>
    </div>
    <div class="layui-row" style="margin-top: 25px;height:92%">
        <div class="layui-tab">
            <ul class="layui-tab-title">
                <li id="devOps_outSampleForecast" class="layui-this"
                    style="font-size: 17px;background-color: #33638B;color: #ffffff;" onclick="forecastClick(this.id,'02')">
                    样本外预测
                </li>
                <li id="devOps_inSampleForecast" style="font-size: 17px;" onclick="forecastClick(this.id,'01')">样本内预测</li>
            </ul>
        </div>
        <div class="layui-col-md12 layui-col-lg12" style="height:90%">
            <div id="echarts1" style="width:100%;height:100%;"></div>
        </div>
    </div>
</div>
<script>
    var title = '样本外预测';
    var echartsId = 'echarts1';
    var sampleFlag = '02'; //样本标识
    var currentTabId = 'devOps_outSampleForecast';
    var dataList = []; //预测值

    //Tab标签卡切换点击事件
    function forecastClick(id, sample) {
        currentTabId = id;
        sampleFlag = sample;
        if (id == 'devOps_inSampleForecast') {
            title = '样本内预测';
            $("#" + id).attr("style", "font-size: 17px;background-color: #33638B;color: #ffffff;");
            $("#devOps_outSampleForecast").attr("style", "font-size: 17px;background-color: #ffffff;color: #000000;");
        } else if (id == 'devOps_outSampleForecast') {
            title = '样本外预测';
            $("#" + id).attr("style", "font-size: 17px;background-color: #33638B;color: #ffffff;");
            $("#devOps_inSampleForecast").attr("style", "font-size: 17px;background-color: #ffffff;color: #000000;");
        }
        // 销毁实例,清空画布
        echarts.init(document.getElementById(echartsId)).dispose();
        queryData();
    }

    //查询图表数据
    function queryData() {
        var periodVal = $("#period").combobox("getValue"); //周期
        var params = {
            type: 'devOps',
            sampleFlag: sampleFlag,
            indicators: $("#indicators").combobox("getValue"),
            index_name: $("#indicators").combobox("getText"),
            resources: $("#resources").combobox("getValue"),
            period: periodVal,
            startTime: ("3,4,5".indexOf(periodVal) == -1) ? $("#startTime1").combobox("getValue") : $("#startTime2").val(),
            endTime: ("3,4,5".indexOf(periodVal) == -1) ? $("#endTime1").combobox("getValue") : $("#endTime2").val()
        };
        if (params.indicators.length == 0) {
            layer.msg("请选择指标!");
            return;
        }
        if (params.resources.length == 0) {
            layer.msg("请选择资源!");
            return;
        }
        if (params.period.length == 0) {
            layer.msg("请选择周期!");
            return;
        }
        if (params.startTime.length == 0) {
            layer.msg("请选择起始时间!");
            return;
        }
        if (params.endTime.length == 0) {
            layer.msg("请选择结束时间!");
            return;
        }
        if (params.startTime.length > 0 && params.endTime.length > 0 && params.endTime < params.startTime) {
            layer.msg("结束时间不能小于起始时间,请重新选择!");
            return;
        }
        //选择指标、资源、周期、时间之后才能调用查询方法
        if (params.indicators.length > 0 && params.resources.length > 0 && periodVal.length > 0 && (params.startTime.length > 0 || params.endTime.length > 0)) {
            getServiceData(currentTabId, params);
        }
    }

    //选择指标动态获取资源下拉选
    function changeIndicatorsElement(value) {
        if (value == '' || value == null) {
            $("#indicators").combobox("setValue", "");
        } else {
            var params = {
                type: "devOps",
                indicators: value
            };
            getservice('./statisticalAnalysis/forecastAnalysis/getResourcesData', params).done(function (res) {
                $("#resources").combobox({
                    valueField: 'value',
                    textField: 'label',
                    data: res
                });
            });
        }
    }

    //点击查看table
    function showTable() {
        $('<div id="tableData" class="tableBox"></div>').dialog({
            title: ' ',
            top: '30%',
            width: '50%',
            height: '50%',
            modal: true,
            closed: false,
            closable: false,
            cache: false,
            buttons: [
                {
                    text: '关闭', handler: function () {
                        $('#tableData').dialog('close')
                    }
                },
                {text: '下载', align: 'right', handler: exportTable}],
            href: '/statisticalAnalysis/static/html/forecastManagement/forecastTable.html',
            onClose: function () {
                $(this).dialog('destroy');
            }
        });
    }

    //导出
    function exportTable() {
        if(dataList.length > 0){
            $('#tableData').datagrid('toExcel','运维预测分析.xls');
        }
    }

    var xhrOnProgress = function (fun) {
        xhrOnProgress.onprogress = fun; //绑定监听
        //使用闭包实现监听绑
        return function () {
            //通过$.ajaxSettings.xhr();获得XMLHttpRequest对象
            var xhr = $.ajaxSettings.xhr();
            //判断监听函数是否为函数
            if (typeof xhrOnProgress.onprogress !== 'function')
                return xhr;
            //如果有监听函数并且xhr对象支持绑定时就把监听函数绑定上去
            if (xhrOnProgress.onprogress && xhr.upload) {
                xhr.upload.onprogress = xhrOnProgress.onprogress;
            }
            return xhr;
        }
    }
</script>
